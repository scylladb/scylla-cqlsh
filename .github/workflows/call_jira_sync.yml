name: Sync Jira Based on PR Events

on:
  pull_request_target:
    types: [opened, edited, ready_for_review, review_requested, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  jira-sync:
    # release PRs list earlier commits, whose issue references aren't theirs
    if: "!startsWith(github.head_ref, 'release/')"
    uses: scylladb/github-automation/.github/workflows/main_pr_events_jira_sync.yml@5f60ad247468c6ca3bbd5244648731b89fddec00 # main
    with:
      caller_action: ${{ github.event.action }}
    secrets:
      caller_jira_auth: ${{ secrets.USER_AND_KEY_FOR_JIRA_AUTOMATION }}
