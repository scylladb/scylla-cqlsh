name: Build/Test and Upload to PyPi

on:
  pull_request:
    branches:
     - master
     - 'branch-*'
  push:
    tags:
      - '*'
    branches:
      - master
      - 'branch-*'

permissions:
  contents: read

env:
  # Test modules that need a live cluster; the unit test job runs everything else.
  PYTEST_IGNORE_CLUSTER_TESTS: >-
    --ignore=./cqlshlib/test/test_batch_input.py
    --ignore=./cqlshlib/test/test_copy_data.py
    --ignore=./cqlshlib/test/test_copy_options.py
    --ignore=./cqlshlib/test/test_copy_round_trip.py
    --ignore=./cqlshlib/test/test_cqlsh_completion.py
    --ignore=./cqlshlib/test/test_cqlsh_output.py
    --ignore=./cqlshlib/test/test_cqlsh_shell.py
    --ignore=./cqlshlib/test/test_escape_sequences.py
    --ignore=./cqlshlib/test/test_formatting.py
    --ignore=./cqlshlib/test/test_proxy_access.py
    --ignore=./cqlshlib/test/test_ssl.py
    --ignore=./cqlshlib/test/test_unicode.py
  # Pinned so a PR's integration result depends on the PR, not on when it ran;
  # Renovate bumps them in their own PRs.
  # renovate: datasource=docker depName=scylladb/scylla
  SCYLLA_VERSION: 2026.3.4
  # renovate: datasource=docker depName=cassandra
  CASSANDRA_VERSION: 5.0.9

jobs:
  unit_tests:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14', '3.15']
        include:
          # oldest and newest interpreters we claim to support
          - {os: windows-latest, python-version: '3.12'}
          - {os: windows-latest, python-version: '3.15'}
          - {os: macos-latest, python-version: '3.12'}
          - {os: macos-latest, python-version: '3.15'}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: pytest
        env:
          # nothing builds the package here, so cqlsh.py falls back to setuptools_scm,
          # which has no tags to work with in a shallow checkout
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          export UV_HTTP_TIMEOUT=120
          uv pip install --system -r ./pylib/requirements.txt setuptools_scm
          pytest ./cqlshlib/test ${{ env.PYTEST_IGNORE_CLUSTER_TESTS }}

  build_dist:
    name: Build wheel and sdist
    if: contains(github.event.pull_request.labels.*.name, 'test-build') || github.event_name == 'push' && endsWith(github.event.ref, 'scylla')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # pure python, one py3-none-any wheel covers every platform
      - name: Build
        run: uv build

      # a wheel that can't even import fails the build
      - name: Smoke test
        run: uvx --from ./dist/*.whl cqlsh --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-dist
          path: dist/*

  integration_test_scylla:
    name: Integration Tests (Scylla, Python ${{ matrix.python-version }})
    if: "!contains(github.event.pull_request.labels.*.name, 'disable-integration-test')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest and newest interpreters we claim to support
        python-version: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # not uv's interpreter: python-build-standalone links libedit instead of
      # GNU readline, and the pty-driven completion tests assert on readline's
      # exact cursor movements
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Start Scylla
        run: |
          # 9042 stays plain for the suite; 9142 is TLS with a required client cert, for test_ssl.py
          export CQL_SSL_TEST_CERTS=${RUNNER_TEMP}/certs
          python ./scripts/gen-test-certs.py ${CQL_SSL_TEST_CERTS}
          # the maintenance socket, for test_maintenance_socket.py
          export SOCKET_DIR=${RUNNER_TEMP}/maint
          mkdir -m 777 ${SOCKET_DIR}
          export DOCKER_ID=$(docker run -d -v ${CQL_SSL_TEST_CERTS}:/certs:ro -v ${SOCKET_DIR}:/sock scylladb/scylla:${{ env.SCYLLA_VERSION }} --cluster-name test \
            --maintenance-socket /sock/cql.m \
            --native-transport-port-ssl 9142 \
            --client-encryption-options enabled=true \
            --client-encryption-options certificate=/certs/server.pem \
            --client-encryption-options keyfile=/certs/server.key \
            --client-encryption-options truststore=/certs/ca.pem \
            --client-encryption-options require_client_auth=true )
          export CQL_TEST_HOST=$(docker inspect --format='{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ${DOCKER_ID})
          while ! nc -z ${CQL_TEST_HOST} 9042 || ! nc -z ${CQL_TEST_HOST} 9142; do
            sleep 0.1 # wait for 1/10 of the second before check again
          done

          echo "CQL_TEST_HOST=${CQL_TEST_HOST}" >> $GITHUB_ENV
          echo "CQL_SSL_TEST_PORT=9142" >> $GITHUB_ENV
          echo "CQL_SSL_TEST_CERTS=${CQL_SSL_TEST_CERTS}" >> $GITHUB_ENV

          # Scylla creates it 0660 as its own uid inside the container
          timeout 60 bash -c "until [ -S ${SOCKET_DIR}/cql.m ]; do sleep 0.1; done" || { docker logs ${DOCKER_ID}; exit 1; }
          sudo chmod 666 ${SOCKET_DIR}/cql.m
          echo "CQL_MAINTENANCE_SOCKET=${SOCKET_DIR}/cql.m" >> $GITHUB_ENV

      - name: pytest
        run: |
          export PIP_RETRIES=10
          export UV_HTTP_TIMEOUT=120
          uv pip install --system -r ./pylib/requirements.txt
          ./reloc/build_reloc.sh
          pytest ./cqlshlib/test
          ./scripts/run-proxy-access-test.sh

  integration_test_cassandra:
    name: Integration Tests (Cassandra)
    if: "!contains(github.event.pull_request.labels.*.name, 'disable-integration-test')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Scylla
        run: |
          export DOCKER_ID=$(docker run -d -e CASSANDRA_CLUSTER_NAME=test cassandra:${{ env.CASSANDRA_VERSION }} )
          export CQL_TEST_HOST=$(docker inspect --format='{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ${DOCKER_ID})
          while ! nc -z ${CQL_TEST_HOST} 9042; do
                  sleep 0.1 # wait for 1/10 of the second before check again
          done

          echo "CQL_TEST_HOST=${CQL_TEST_HOST}" >> $GITHUB_ENV

      - name: pytest
        run: |
          export PIP_RETRIES=10
          pip install -r ./pylib/requirements.txt
           ./reloc/build_reloc.sh
          pytest ./cqlshlib/test

  # GitHub's Windows runners only run Windows containers, so Scylla runs in Docker inside WSL2
  # and the tests run on the Windows side, reaching it through WSL's localhost forwarding.
  integration_test_scylla_windows:
    name: Integration Tests (Scylla in WSL2, Windows)
    if: "!contains(github.event.pull_request.labels.*.name, 'disable-integration-test')"
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install WSL2 Ubuntu
        shell: pwsh
        run: |
          wsl --version
          wsl --set-default-version 2
          wsl --install -d Ubuntu-24.04 --no-launch
          wsl -d Ubuntu-24.04 -u root -- uname -a
          wsl -l -v
          # WSL shuts the VM down (and Scylla with it) once no wsl.exe is attached; keep one around
          Start-Process -WindowStyle Hidden wsl -ArgumentList '-d','Ubuntu-24.04','-u','root','--','sleep','infinity'

      - name: Start Scylla
        shell: pwsh
        run: |
          wsl -d Ubuntu-24.04 -u root -- bash -euxc "curl -fsSL https://get.docker.com | sh; service docker start || true; sysctl -w fs.aio-max-nr=1048576"
          wsl -d Ubuntu-24.04 -u root -- docker run -d --name scylla -p 9042:9042 -p 19042:19042 scylladb/scylla:${{ env.SCYLLA_VERSION }} --cluster-name test --smp 2 --memory 2G --overprovisioned 1 --broadcast-rpc-address 127.0.0.1

      - name: pytest
        shell: bash
        env:
          CQL_TEST_HOST: 127.0.0.1
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          export UV_HTTP_TIMEOUT=120
          uv pip install --system -r ./pylib/requirements.txt setuptools_scm
          python ./scripts/wait-for-cql.py 127.0.0.1
          # test_proxy_access needs iptables and a docker proxy container on the test host;
          # known Windows failures are skipped in the tests themselves, with their issues
          python -X faulthandler -m pytest -v ./cqlshlib/test --ignore=./cqlshlib/test/test_proxy_access.py

      - name: Scylla logs
        if: failure()
        shell: pwsh
        run: wsl -d Ubuntu-24.04 -u root -- docker logs scylla

  # Docker on macOS runners needs a VM (colima); Apple silicon runners don't allow nested
  # virtualization, so this has to be an Intel runner.
  integration_test_scylla_macos:
    name: Integration Tests (Scylla in colima, macOS)
    if: "!contains(github.event.pull_request.labels.*.name, 'disable-integration-test')"
    runs-on: macos-26-intel
    # a good run takes ~50 minutes, and slow runners can take far longer (setup alone has taken 33)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # not douglascamata/setup-docker-macos-action: its `brew update` + `brew install docker`
      # builds Go and docker from source on Intel runners, 12-30 minutes of the job
      - name: Start colima
        env:
          LIMA_VERSION: v2.2.1
          COLIMA_VERSION: v0.10.3
          DOCKER_VERSION: 29.9.2
        run: |
          sudo mkdir -p /usr/local/libexec
          sudo chown "$(id -u)" /usr/local/libexec
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/${LIMA_VERSION}/lima-${LIMA_VERSION#v}-Darwin-x86_64.tar.gz" | tar Cxzm /usr/local
          curl -fsSL -o colima "https://github.com/abiosoft/colima/releases/download/${COLIMA_VERSION}/colima-Darwin-x86_64"
          install colima /usr/local/bin/colima
          curl -fsSL "https://download.docker.com/mac/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz" | tar xz --strip-components 1 -C /usr/local/bin docker/docker
          colima start --cpu "$(sysctl -n hw.ncpu)" --memory "$(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 ))" --arch x86_64 --vm-type=vz --mount-type=virtiofs
          docker version

      - name: Start Scylla
        run: |
          # writes inside colima can take past the 2s server default (COPY FROM batches hit WriteTimeout)
          docker run -d --name scylla -p 9042:9042 -p 19042:19042 scylladb/scylla:${{ env.SCYLLA_VERSION }} --cluster-name test --smp 2 --memory 2G --overprovisioned 1 --broadcast-rpc-address 127.0.0.1 \
            --write-request-timeout-in-ms 10000

      - name: pytest
        env:
          CQL_TEST_HOST: 127.0.0.1
          # Scylla shares the runner's 4 cores with the tests through colima, and is slow
          CQL_TEST_TIMEOUT_SCALE: "3"
          # reloc/build_reloc.sh is Linux-only, so nothing builds the package here
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          export UV_HTTP_TIMEOUT=120
          uv pip install --system -r ./pylib/requirements.txt setuptools_scm
          python ./scripts/wait-for-cql.py 127.0.0.1
          # test_proxy_access needs iptables on the test host
          pytest ./cqlshlib/test --ignore=./cqlshlib/test/test_proxy_access.py --durations=25

      - name: Scylla logs
        if: failure()
        run: docker logs scylla

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # to tell whether the tag is on master

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: determine docker tag base on tag
        if: endsWith(github.event.ref, '-scylla')
        shell: bash
        run: |
          split=(${GITHUB_REF_NAME//-/ })
          DOCKER_TAG=${split[0]}
          echo DOCKER_TAG=$DOCKER_TAG >> $GITHUB_ENV
          # a tag on a branch-* mustn't move :latest back
          if git merge-base --is-ancestor HEAD origin/master; then
            echo LATEST_TAG=scylladb/scylla-cqlsh:latest >> $GITHUB_ENV
          fi

      - name: Build and push release
        if: endsWith(github.event.ref, '-scylla')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            scylladb/scylla-cqlsh:${{ env.DOCKER_TAG }}
            ${{ env.LATEST_TAG }}

      - name: Build and push master
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: endsWith(github.event.ref, 'master')
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          push: true
          tags: |
            scylladb/scylla-cqlsh:master

  upload_pypi:
    needs: [unit_tests, build_dist, integration_test_scylla, integration_test_cassandra]
    runs-on: ubuntu-latest
    # upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && endsWith(github.event.ref, 'scylla')
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    # if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: artifacts-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
