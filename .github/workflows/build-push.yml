name: Build/Test and Upload to PyPi

on:
  pull_request:
    # labeled: adding test-windows / test-macos to an open PR starts those jobs
    types: [opened, synchronize, reopened, labeled]
    branches:
     - master
     - 'branch-*'
  push:
    tags:
      - '*'
    branches:
      - master
      - 'branch-*'

permissions:
  contents: read

# PR labels:
#   test-windows / test-macos  run the Windows / macOS jobs (they always run on push)
#   disable-integration-test   skip the integration tests
#   disable-all-tests          skip every test job
# Adding a label runs only the jobs that label turns on.

env:
  # Test modules that need a live cluster; the unit test job runs everything else.
  PYTEST_IGNORE_CLUSTER_TESTS: >-
    --ignore=./cqlshlib/test/test_batch_input.py
    --ignore=./cqlshlib/test/test_copy_data.py
    --ignore=./cqlshlib/test/test_copy_options.py
    --ignore=./cqlshlib/test/test_copy_round_trip.py
    --ignore=./cqlshlib/test/test_cqlsh_completion.py
    --ignore=./cqlshlib/test/test_cqlsh_output.py
    --ignore=./cqlshlib/test/test_cqlsh_shell.py
    --ignore=./cqlshlib/test/test_escape_sequences.py
    --ignore=./cqlshlib/test/test_formatting.py
    --ignore=./cqlshlib/test/test_proxy_access.py
    --ignore=./cqlshlib/test/test_ssl.py
    --ignore=./cqlshlib/test/test_unicode.py
  # Pinned so a PR's integration result depends on the PR, not on when it ran;
  # Renovate bumps them in their own PRs.
  # renovate: datasource=docker depName=scylladb/scylla
  SCYLLA_VERSION: 2026.3.4
  # renovate: datasource=docker depName=cassandra
  CASSANDRA_VERSION: 5.0.9

jobs:
  unit_tests:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event.action != 'labeled' && !contains(github.event.pull_request.labels.*.name, 'disable-all-tests')
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14', '3.15']

    steps: &unit_test_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: pytest
        env:
          # nothing builds the package here, so cqlsh.py falls back to setuptools_scm,
          # which has no tags to work with in a shallow checkout
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          export UV_HTTP_TIMEOUT=120
          uv pip install --system -r ./pylib/requirements.txt setuptools_scm
          pytest ./cqlshlib/test ${{ env.PYTEST_IGNORE_CLUSTER_TESTS }}

  unit_tests_windows:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name == 'push' || (github.event.action != 'labeled' || github.event.label.name == 'test-windows') && contains(github.event.pull_request.labels.*.name, 'test-windows') && !contains(github.event.pull_request.labels.*.name, 'disable-all-tests')
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        # oldest and newest interpreters we claim to support
        python-version: ['3.12', '3.15']
    steps: *unit_test_steps

  unit_tests_macos:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name == 'push' || (github.event.action != 'labeled' || github.event.label.name == 'test-macos') && contains(github.event.pull_request.labels.*.name, 'test-macos') && !contains(github.event.pull_request.labels.*.name, 'disable-all-tests')
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ['3.12', '3.15']
    steps: *unit_test_steps

  build_dist:
    name: Build wheel and sdist
    if: (github.event.action != 'labeled' || github.event.label.name == 'test-build') && contains(github.event.pull_request.labels.*.name, 'test-build') || github.event_name == 'push' && endsWith(github.event.ref, 'scylla')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # pure python, one py3-none-any wheel covers every platform
      - name: Build
        run: uv build

      # a wheel that can't even import fails the build
      - name: Smoke test
        run: uvx --from ./dist/*.whl cqlsh --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-dist
          path: dist/*

  # Each scylla release gets packages built for its own python: master and branch-X.Y
  # here build in the toolchain of scylladb's branch of the same name, and the packages
  # require that scylla release's scylla-python3. A fix reaches older releases by being
  # backported to their branch-X.Y here and released from there.
  # Found once, so both arches build in the same toolchain for the same release.
  scylla_branch:
    name: Find the scylla branch
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.scylla.outputs.release }}
      image: ${{ steps.scylla.outputs.image }}
      upload-release: ${{ steps.scylla.outputs.upload-release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the branches, to find the one a tag is on

      - name: Find the scylla branch
        id: scylla
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # a tag belongs to the branch its release PR was merged into
            if git merge-base --is-ancestor HEAD origin/master; then
              branch=master
            else
              mapfile -t branches < <(git for-each-ref --contains HEAD --format='%(refname:lstrip=3)' 'refs/remotes/origin/branch-*')
              if [ ${#branches[@]} -ne 1 ]; then
                echo "::error::$GITHUB_REF_NAME is on none or several of master and branch-*: ${branches[*]}"
                exit 1
              fi
              branch=${branches[0]}
            fi
          elif [ -n "$GITHUB_BASE_REF" ]; then
            branch=$GITHUB_BASE_REF
          else
            branch=$GITHUB_REF_NAME
          fi
          # branches scylladb.git doesn't have (branch-2024.1) build in master's toolchain,
          # for CI only: their packages aren't for any scylla release, so they aren't uploaded
          releasable=true
          rc=0
          sha=$(git ls-remote --exit-code --heads https://github.com/scylladb/scylladb "refs/heads/$branch") || rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::scylladb has no $branch, building in the toolchain of its master; these packages can't be released"
            branch=master
            rc=0
            sha=$(git ls-remote --exit-code --heads https://github.com/scylladb/scylladb refs/heads/master) || rc=$?
            releasable=false
          fi
          if [ $rc -ne 0 ]; then
            echo "::error::can't list the branches of scylladb"
            exit 1
          fi
          # read both files from one commit, so the release and the toolchain always match
          sha=${sha%%[[:space:]]*}
          url=https://raw.githubusercontent.com/scylladb/scylladb/$sha
          if ! version_gen=$(curl -sfL "$url/SCYLLA-VERSION-GEN") || ! image=$(curl -sfL "$url/tools/toolchain/image"); then
            echo "::error::can't read SCYLLA-VERSION-GEN and tools/toolchain/image of scylladb $branch"
            exit 1
          fi
          release=$(sed -nE 's/^VERSION=([0-9]+\.[0-9]+)\..*/\1/p' <<<"$version_gen")
          if [ -z "$release" ] || [ -z "$image" ]; then
            echo "::error::no X.Y version or toolchain image in scylladb $branch"
            exit 1
          fi
          echo "scylladb $branch ($sha): scylla $release, $image"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if $releasable; then
            echo "upload-release=$release" >> "$GITHUB_OUTPUT"
          fi

  build_packages:
    name: Build scylla packages (${{ matrix.arch }})
    needs: scylla_branch
    # native runners, the compiled dependencies are per arch
    runs-on: ${{ matrix.os }}
    env:
      SCYLLA_PYTHON3_RELEASE: ${{ needs.scylla_branch.outputs.release }}
      TOOLCHAIN_IMAGE: ${{ needs.scylla_branch.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # setuptools_scm needs the tags

      # vX.Y.Z-scylla tags are released as packages X.Y.Z-1, anything else is a CI build
      - name: Set package version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)-scylla$ ]]; then
            echo "PKG_VERSION=scylla-${BASH_REMATCH[1]}-1" >> "$GITHUB_ENV"
          else
            echo "PKG_VERSION=scylla-0.0.0-0.ci" >> "$GITHUB_ENV"
          fi

      - name: Build relocatable package, rpm and deb
        run: |
          docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -e PKG_VERSION -e SCYLLA_PYTHON3_RELEASE -v $PWD:$PWD -w $PWD "$TOOLCHAIN_IMAGE" bash -ec '
            ./reloc/build_reloc.sh --version "$PKG_VERSION" --nodeps
            ./reloc/build_rpm.sh --reloc-pkg build/scylla-cqlsh-*.tar.gz --scylla-release "$SCYLLA_PYTHON3_RELEASE"
            ./reloc/build_deb.sh --reloc-pkg build/scylla-cqlsh-*.tar.gz --scylla-release "$SCYLLA_PYTHON3_RELEASE"'

      # the Architecture: all transitional deb is built on both arches under the same
      # name; keep only the x86_64 one so upload_packages' merged download has one copy
      - name: Drop duplicate arch-independent debs
        if: matrix.arch != 'x86_64'
        run: rm -f build/debian/*_all.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: |
            build/scylla-cqlsh-*.tar.gz
            build/redhat/RPMS/*/*.rpm
            build/debian/*.deb
          if-no-files-found: error

  integration_test_scylla:
    name: Integration Tests (Scylla, Python ${{ matrix.python-version }})
    if: github.event.action != 'labeled' && !contains(github.event.pull_request.labels.*.name, 'disable-integration-test') && !contains(github.event.pull_request.labels.*.name, 'disable-all-tests')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest and newest interpreters we claim to support
        python-version: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # not uv's interpreter: python-build-standalone links libedit instead of
      # GNU readline, and the pty-driven completion tests assert on readline's
      # exact cursor movements
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Start Scylla
        run: |
          # 9042 stays plain for the suite; 9142 is TLS with a required client cert, for test_ssl.py
          export CQL_SSL_TEST_CERTS=${RUNNER_TEMP}/certs
          python ./scripts/gen-test-certs.py ${CQL_SSL_TEST_CERTS}
          # the maintenance socket, for test_maintenance_socket.py
          export SOCKET_DIR=${RUNNER_TEMP}/maint
          mkdir -m 777 ${SOCKET_DIR}
          export DOCKER_ID=$(docker run -d -v ${CQL_SSL_TEST_CERTS}:/certs:ro -v ${SOCKET_DIR}:/sock scylladb/scylla:${{ env.SCYLLA_VERSION }} --cluster-name test \
            --maintenance-socket /sock/cql.m \
            --native-transport-port-ssl 9142 \
            --client-encryption-options enabled=true \
            --client-encryption-options certificate=/certs/server.pem \
            --client-encryption-options keyfile=/certs/server.key \
            --client-encryption-options truststore=/certs/ca.pem \
            --client-encryption-options require_client_auth=true )
          export CQL_TEST_HOST=$(docker inspect --format='{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ${DOCKER_ID})
          while ! nc -z ${CQL_TEST_HOST} 9042 || ! nc -z ${CQL_TEST_HOST} 9142; do
            sleep 0.1 # wait for 1/10 of the second before check again
          done

          echo "CQL_TEST_HOST=${CQL_TEST_HOST}" >> $GITHUB_ENV
          echo "CQL_SSL_TEST_PORT=9142" >> $GITHUB_ENV
          echo "CQL_SSL_TEST_CERTS=${CQL_SSL_TEST_CERTS}" >> $GITHUB_ENV

          # Scylla creates it 0660 as its own uid inside the container
          timeout 60 bash -c "until [ -S ${SOCKET_DIR}/cql.m ]; do sleep 0.1; done" || { docker logs ${DOCKER_ID}; exit 1; }
          sudo chmod 666 ${SOCKET_DIR}/cql.m
          echo "CQL_MAINTENANCE_SOCKET=${SOCKET_DIR}/cql.m" >> $GITHUB_ENV

      - name: pytest
        run: |
          export PIP_RETRIES=10
          export UV_HTTP_TIMEOUT=120
          uv pip install --system -r ./pylib/requirements.txt
          ./reloc/build_reloc.sh
          pytest ./cqlshlib/test
          ./scripts/run-proxy-access-test.sh

  integration_test_cassandra:
    name: Integration Tests (Cassandra)
    if: github.event.action != 'labeled' && !contains(github.event.pull_request.labels.*.name, 'disable-integration-test') && !contains(github.event.pull_request.labels.*.name, 'disable-all-tests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Scylla
        run: |
          export DOCKER_ID=$(docker run -d -e CASSANDRA_CLUSTER_NAME=test cassandra:${{ env.CASSANDRA_VERSION }} )
          export CQL_TEST_HOST=$(docker inspect --format='{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ${DOCKER_ID})
          while ! nc -z ${CQL_TEST_HOST} 9042; do
                  sleep 0.1 # wait for 1/10 of the second before check again
          done

          echo "CQL_TEST_HOST=${CQL_TEST_HOST}" >> $GITHUB_ENV

      - name: pytest
        run: |
          export PIP_RETRIES=10
          pip install -r ./pylib/requirements.txt
           ./reloc/build_reloc.sh
          pytest ./cqlshlib/test

  # GitHub's Windows runners only run Windows containers, so Scylla runs in Docker inside WSL2
  # and the tests run on the Windows side, reaching it through WSL's localhost forwarding.
  integration_test_scylla_windows:
    name: Integration Tests (Scylla in WSL2, Windows)
    if: github.event_name == 'push' || (github.event.action != 'labeled' || github.event.label.name == 'test-windows') && contains(github.event.pull_request.labels.*.name, 'test-windows') && !contains(github.event.pull_request.labels.*.name, 'disable-integration-test') && !contains(github.event.pull_request.labels.*.name, 'disable-all-tests')
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install WSL2 Ubuntu
        shell: pwsh
        run: |
          wsl --version
          wsl --set-default-version 2
          wsl --install -d Ubuntu-24.04 --no-launch
          wsl -d Ubuntu-24.04 -u root -- uname -a
          wsl -l -v
          # WSL shuts the VM down (and Scylla with it) once no wsl.exe is attached; keep one around
          Start-Process -WindowStyle Hidden wsl -ArgumentList '-d','Ubuntu-24.04','-u','root','--','sleep','infinity'

      - name: Start Scylla
        shell: pwsh
        run: |
          wsl -d Ubuntu-24.04 -u root -- bash -euxc "curl -fsSL https://get.docker.com | sh; service docker start || true; sysctl -w fs.aio-max-nr=1048576"
          wsl -d Ubuntu-24.04 -u root -- docker run -d --name scylla -p 9042:9042 -p 19042:19042 scylladb/scylla:${{ env.SCYLLA_VERSION }} --cluster-name test --smp 2 --memory 2G --overprovisioned 1 --broadcast-rpc-address 127.0.0.1

      - name: pytest
        shell: bash
        env:
          CQL_TEST_HOST: 127.0.0.1
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          export UV_HTTP_TIMEOUT=120
          uv pip install --system -r ./pylib/requirements.txt setuptools_scm
          python ./scripts/wait-for-cql.py 127.0.0.1
          # test_proxy_access needs iptables and a docker proxy container on the test host;
          # known Windows failures are skipped in the tests themselves, with their issues
          python -X faulthandler -m pytest -v ./cqlshlib/test --ignore=./cqlshlib/test/test_proxy_access.py

      - name: Scylla logs
        if: failure()
        shell: pwsh
        run: wsl -d Ubuntu-24.04 -u root -- docker logs scylla

  # Docker on macOS runners needs a VM (colima); Apple silicon runners don't allow nested
  # virtualization, so this has to be an Intel runner.
  integration_test_scylla_macos:
    name: Integration Tests (Scylla in colima, macOS)
    if: github.event_name == 'push' || (github.event.action != 'labeled' || github.event.label.name == 'test-macos') && contains(github.event.pull_request.labels.*.name, 'test-macos') && !contains(github.event.pull_request.labels.*.name, 'disable-integration-test') && !contains(github.event.pull_request.labels.*.name, 'disable-all-tests')
    runs-on: macos-26-intel
    # a good run takes ~50 minutes, and slow runners can take far longer (setup alone has taken 33)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # not douglascamata/setup-docker-macos-action: its `brew update` + `brew install docker`
      # builds Go and docker from source on Intel runners, 12-30 minutes of the job
      - name: Start colima
        env:
          LIMA_VERSION: v2.2.1
          COLIMA_VERSION: v0.10.3
          DOCKER_VERSION: 29.9.2
        run: |
          sudo mkdir -p /usr/local/libexec
          sudo chown "$(id -u)" /usr/local/libexec
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/${LIMA_VERSION}/lima-${LIMA_VERSION#v}-Darwin-x86_64.tar.gz" | tar Cxzm /usr/local
          curl -fsSL -o colima "https://github.com/abiosoft/colima/releases/download/${COLIMA_VERSION}/colima-Darwin-x86_64"
          install colima /usr/local/bin/colima
          curl -fsSL "https://download.docker.com/mac/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz" | tar xz --strip-components 1 -C /usr/local/bin docker/docker
          colima start --cpu "$(sysctl -n hw.ncpu)" --memory "$(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 ))" --arch x86_64 --vm-type=vz --mount-type=virtiofs
          docker version

      - name: Start Scylla
        run: |
          # writes inside colima can take past the 2s server default (COPY FROM batches hit WriteTimeout)
          docker run -d --name scylla -p 9042:9042 -p 19042:19042 scylladb/scylla:${{ env.SCYLLA_VERSION }} --cluster-name test --smp 2 --memory 2G --overprovisioned 1 --broadcast-rpc-address 127.0.0.1 \
            --write-request-timeout-in-ms 10000

      - name: pytest
        env:
          CQL_TEST_HOST: 127.0.0.1
          # Scylla shares the runner's 4 cores with the tests through colima, and is slow
          CQL_TEST_TIMEOUT_SCALE: "3"
          # reloc/build_reloc.sh is Linux-only, so nothing builds the package here
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          export UV_HTTP_TIMEOUT=120
          uv pip install --system -r ./pylib/requirements.txt setuptools_scm
          python ./scripts/wait-for-cql.py 127.0.0.1
          # test_proxy_access needs iptables on the test host
          pytest ./cqlshlib/test --ignore=./cqlshlib/test/test_proxy_access.py --durations=25

      - name: Scylla logs
        if: failure()
        run: docker logs scylla

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # to tell whether the tag is on master

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: determine docker tag base on tag
        if: endsWith(github.event.ref, '-scylla')
        shell: bash
        run: |
          split=(${GITHUB_REF_NAME//-/ })
          DOCKER_TAG=${split[0]}
          echo DOCKER_TAG=$DOCKER_TAG >> $GITHUB_ENV
          # a tag on a branch-* mustn't move :latest back
          if git merge-base --is-ancestor HEAD origin/master; then
            echo LATEST_TAG=scylladb/scylla-cqlsh:latest >> $GITHUB_ENV
          fi

      - name: Build and push release
        if: endsWith(github.event.ref, '-scylla')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            scylladb/scylla-cqlsh:${{ env.DOCKER_TAG }}
            ${{ env.LATEST_TAG }}

      - name: Build and push master
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: endsWith(github.event.ref, 'master')
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          push: true
          tags: |
            scylladb/scylla-cqlsh:master

  # scylladb.git doesn't build cqlsh any more, scylla-pkg takes the packages of each scylla
  # release from its own directory into the scylla repositories, the same as scylla-node-exporter
  upload_packages:
    needs: [unit_tests, unit_tests_windows, unit_tests_macos, scylla_branch, build_packages, integration_test_scylla, integration_test_cassandra]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-scylla')
    permissions:
      contents: read
      id-token: write  # OIDC token for the AWS role, no static keys
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          pattern: packages-*
          merge-multiple: true

      - name: Check the AWS role is set
        env:
          ROLE_ARN: ${{ vars.AWS_S3_UPLOAD_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::repository variable AWS_S3_UPLOAD_ROLE_ARN is not set, can't upload the packages"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_S3_UPLOAD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload rpm, deb and relocatable packages to S3
        env:
          SCYLLA_PYTHON3_RELEASE: ${{ needs.scylla_branch.outputs.upload-release }}
        run: |
          # build_packages only gives tags of the form vX.Y.Z-scylla a release version
          if [ -n "$(find packages -name '*0.0.0-0.ci*')" ]; then
            echo "::error::$GITHUB_REF_NAME is not a vX.Y.Z-scylla tag, its packages have the CI version"
            exit 1
          fi
          if [ -z "$SCYLLA_PYTHON3_RELEASE" ]; then
            echo "::error::scylladb has no branch for $GITHUB_REF_NAME, its packages aren't for any scylla release"
            exit 1
          fi
          dest=s3://downloads.scylladb.com/downloads/scylla/cqlsh/$SCYLLA_PYTHON3_RELEASE
          # flat: the artifact keeps build/'s redhat/RPMS/<arch>/ and debian/ subdirectories
          upload() {
            if [ -z "$(find packages -type f -name "$1")" ]; then
              echo "::error::no $1 package to upload"
              exit 1
            fi
            find packages -type f -name "$1" -print0 | xargs -0 -I{} aws s3 cp {} "$dest/$2/"
          }
          upload '*.rpm' rpm
          upload '*.deb' deb
          upload '*.tar.gz' relocatable

  upload_pypi:
    needs: [unit_tests, unit_tests_windows, unit_tests_macos, build_dist, build_packages, integration_test_scylla, integration_test_cassandra]
    runs-on: ubuntu-latest
    # upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && endsWith(github.event.ref, 'scylla')
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    # if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: artifacts-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
